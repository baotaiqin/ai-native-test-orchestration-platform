[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-test-platform-runner"
version = "0.1.0"
description = "AI 原生智能测试编排平台 Windows Runner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pika>=1.3,<2",
    "pymysql>=1.1,<2",
    "playwright>=1.51,<2",
]

[project.scripts]
test-platform-runner = "runner.main:main"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
