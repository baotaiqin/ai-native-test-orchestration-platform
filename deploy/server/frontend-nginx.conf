pid /tmp/nginx/nginx.pid;
worker_processes auto;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # The backend accepts files up to 20 MiB. One extra MiB leaves room for
    # multipart boundaries and metadata while the backend keeps final authority.
    client_max_body_size 21m;

    upstream frontend_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store, max-age=0" always;
            try_files /index.html =404;
        }

        # Deployment-specific public Demo credentials. These values are intentionally
        # visible to browser visitors; keep this environment free of production assets.
        location = /runtime-config.js {
            alias /tmp/nginx/runtime/runtime-config.js;
            default_type application/javascript;
            add_header Cache-Control "no-store, max-age=0" always;
        }

        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The authenticated run stream must remain unbuffered end to end.
        location ~ ^/api/v1/runs/[^/]+/events/stream$ {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering "no" always;
        }

        # Keep /api/v1 itself out of SPA fallback and preserve the complete URI.
        location = /api/v1 {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
            proxy_read_timeout 120s;
        }

        location /api/v1/ {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
