[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-test-platform-backend"
version = "0.1.0"
description = "AI 原生智能测试编排平台后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "cryptography>=46.0,<51.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "minio>=7.2,<8.0",
    "pydantic-settings>=2.7,<3.0",
    "pika>=1.3,<2.0",
    "prometheus-client>=0.21,<1.0",
    "psutil>=6.1,<8.0",
    "pymysql>=1.1,<2.0",
    "PyJWT>=2.13,<3.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "tzdata>=2025.2,<2027.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
